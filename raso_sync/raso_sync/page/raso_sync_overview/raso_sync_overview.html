<div class="container raso-sync-overview">
    <div class="overview-description">
        <p>{{__("Manage and monitor your RASO Sync status from this overview page.")}}</p>
    </div>
    <div class="form-container">
        <div id="sync-status-banner" class="sync-status-banner idle">
            <span class="indicator"></span>
            <span id="sync-status-text">{{__("Synchronization is idle")}}</span>
        </div>

        <div class="status-cards">
            <div class="status-card">
                <h5>{{__("Last Sale Import")}}</h5>
                <div class="value" id="last-sale-import"></div>
            </div>
            <div class="status-card">
                <h5>{{__("Last Data Export")}}</h5>
                <div class="value" id="last-data-export"></div>
            </div>
        </div>

        <!-- System Actions -->
        <div class="action-section">
            <h4>{{__("System Actions")}}</h4>
            <div class="action-buttons">
                <button class="btn btn-sm btn-primary" id="refresh-btn">
                    <i class="fa fa-refresh"></i>
                    {{__("Refresh Status")}}
                </button>
                <button class="btn btn-sm btn-default" id="test-connection-btn">
                    <i class="fa fa-plug"></i> {{__("Test Connection")}}
                </button>
                <button class="btn btn-sm btn-default" id="check-logs-btn">
                    <i class="fa fa-file-text-o"></i> {{__("Check Logs")}}
                </button>
            </div>
        </div>

        <!-- Manual Sync Actions -->
        <div class="action-section">
            <h4>{{__("Manual Sync")}}</h4>
            <div class="action-group">
                <button class="btn btn-sm btn-success" id="upload-btn">
                    <i class="fa fa-upload"></i> {{__("Upload Data")}}
                </button>

                <div id="upload-options" class="sync-options">
                    <label>{{__("Data Type:")}}</label>
                    <select class="form-control form-control-sm" id="upload-type">
                        <option value="goods">{{__("Goods (Items)")}}</option>
                        <option value="good_prices">{{__("Good Prices")}}</option>
                        <option value="customers">{{__("Customers")}}</option>
                        <option value="all">{{__("All Data Types")}}</option>
                    </select>

                    <label>{{__("Sync Mode:")}}</label>
                    <div class="checkbox-group">
                        <div class="checkbox">
                            <label>
                                <input type="radio" name="upload-mode" value="fullsync" id="fullsync-radio">
                                {{__("Full Sync (takes a long time - sends all data)")}}
                            </label>
                        </div>
                        <div class="checkbox">
                            <label>
                                <input type="radio" name="upload-mode" value="today" id="today-radio" checked>
                                {{__("Send all changes of today")}}
                            </label>
                        </div>
                    </div>

                    <button class="btn btn-sm btn-primary" id="execute-upload-btn">
                        <i class="fa fa-check"></i> {{__("Execute Upload")}}
                    </button>
                    <button class="btn btn-sm btn-default" id="cancel-upload-btn">
                        {{__("Cancel")}}
                    </button>
                </div>
            </div>
            <div class="action-group">
                <button class="btn btn-sm btn-info" id="fetch-btn">
                    <i class="fa fa-download"></i> {{__("Get Data")}}
                </button>

                <div id="fetch-options" class="sync-options">
                    <label>{{__("Data Type:")}}</label>
                    <select class="form-control form-control-sm" id="fetch-type">
                        <option value="sale_invoices">{{__("Sale Invoices")}}</option>
                    </select>

                    <button class="btn btn-sm btn-primary" id="execute-fetch-btn">
                        <i class="fa fa-check"></i> {{__("Execute Fetch")}}
                    </button>
                    <button class="btn btn-sm btn-default" id="cancel-fetch-btn">
                        {{__("Cancel")}}
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
