<div class="container raso-sync-overview">
    <div class="overview-description">
        <p>{{__("Manage and monitor RASO Sync status from this overview page.")}}</p>
    </div>
    <div class="form-container">
        <div id="sync-status-banner" class="sync-status-banner idle">
            <span class="indicator"></span>
            <span id="sync-status-text">{{__("Synchronization is idle")}}</span>
        </div>

        <div class="status-cards">
            <div class="status-card">
                <h5>{{__("Last Sale Import")}}</h5>
                <div class="value" id="last-sale-import"></div>
            </div>
            <div class="status-card">
                <h5>{{__("Last Data Export")}}</h5>
                <div class="value" id="last-data-export"></div>
            </div>
        </div>

        <div class="action-section">
            <h4>{{__("Manual Sync and other actions")}}</h4>
            <div class="action-buttons" id="sync-buttons">
                <button class="btn btn-sm btn-success" id="send-btn">
                    <i class="fa fa-send"></i> {{__("Send Data")}}
                </button>
                <button class="btn btn-sm btn-info" id="fetch-btn">
                    <i class="fa fa-download"></i> {{__("Get Data")}}
                </button>
                <div class="divider"></div>
                <button class="btn btn-sm btn-default" id="test-connection-btn">
                    <i class="fa fa-plug"></i> {{__("Test Connection")}}
                </button>
                <button class="btn btn-sm btn-default" id="check-logs-btn">
                    <i class="fa fa-file-text-o"></i> {{__("Check Logs")}}
                </button>
                <button class="btn btn-sm btn-default" id="open-scheduled-jobs-btn">
                    <i class="fa fa-clock-o"></i> {{__("Scheduled Jobs")}}
                </button>
            </div>
            <div class="action-group">
                <div id="send-options" class="sync-options">
                    <label>{{__("Data Type:")}}</label>
                    <select class="form-control form-control-sm" id="send-type">
                        <option value="all">{{__("All Data Types")}}</option>
                        <option value="good_prices">{{__("Good Prices")}}</option>
                        <option value="goods">{{__("Goods (Items)")}}</option>
                        <option value="good_groups">{{__("Good Groups")}}</option>
                        <option value="partners">{{__("Customers")}}</option>
                    </select>
                    <label>{{__("Sync Mode:")}}</label>
                    <div class="checkbox-group">
                        <div class="checkbox">
                            <label>
                                <input type="radio" name="send-mode" value="full" id="fullsync-radio">
                                {{__("Full Sync (takes a long time - sends all data)")}}
                            </label>
                        </div>
                        <div class="checkbox">
                            <label>
                                <input type="radio" name="send-mode" value="today" id="today-radio" checked>
                                {{__("Send all changes of today")}}
                            </label>
                        </div>
                    </div>

                    <button class="btn btn-sm btn-primary" id="execute-send-btn">
                        <i class="fa fa-check"></i> {{__("Execute Send")}}
                    </button>
                    <button class="btn btn-sm btn-default" id="cancel-send-btn">
                        <i class="fa fa-times"></i> {{__("Cancel")}}
                    </button>
                </div>
            </div>
        </div>
        <div class="action-section queued-docs-section">
            <h4>{{__("Pending Documents (to be sent)")}}</h4>
            <div id="queued-docs-indicator" class="alert alert-info hidden"></div>
            <div id="queued-docs-container" class="queued-docs-container">
                <p class="empty-state">{{__("No pending documents to be sent")}}</p>
            </div>
        </div>
    </div>
</div>
